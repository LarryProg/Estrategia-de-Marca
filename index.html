<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="twitter:description" content="Armamos tu marca de artista en 6 pasos, en un chat conmigo. Para los artistas de Larry Prod.">
<meta name="twitter:image" content="https://larryprog.github.io/Estrategia-de-Marca/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600&family=Special+Elite&family=DM+Mono:wght@400;500&family=Press+Start+2P&family=VT323&family=Playfair+Display:wght@700&family=Permanent+Marker&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --card:#131313; --card2:#1a1a1a; --line:#272727; --line2:#353535;
    --text:#f0ede6; --muted:#9a968e; --dim:#615e58; --white:#ffffff;
    --ok:#7fd49b; --r:14px; --px:#000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:16.5px;line-height:1.5;height:100%;overflow:hidden}
  a{color:inherit}
  button{font-family:inherit}
  .mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .ps{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.04em;line-height:1.5}
  h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.1;letter-spacing:-.01em}
  .dots-bg{background:#2a79d3 var(--sky) center bottom / cover no-repeat;image-rendering:pixelated}

  /* ── GATE ── */
  #gate{position:fixed;inset:0;z-index:999;background:#1a58b4 var(--sky) center bottom / cover no-repeat;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .4s}
  #gate.hide{opacity:0;pointer-events:none}
  .gate-card{width:100%;max-width:360px;text-align:center}
  .gate-card img{width:104px;margin-bottom:20px;filter:drop-shadow(3px 3px 0 #0b2c5c)}
  .gate-box{background:#fff;color:#141414;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:20px 18px}
  .gate-card h3{font-family:'Press Start 2P',monospace;font-weight:400;font-size:12px;line-height:1.5;margin-bottom:10px}
  .gate-card p{font-family:'VT323',monospace;font-size:21px;line-height:1.1;color:#3d3a35;margin-bottom:16px}
  .gate-card input{width:100%;background:#fff;border:3px solid #000;color:#141414;padding:12px 14px;font-size:16px;text-align:center;font-family:'DM Mono',monospace;letter-spacing:.1em;outline:none}
  .gate-card .err{color:#b2402c;font-size:14px;min-height:22px;margin:8px 0}
  .gbtn{width:100%;background:#7fff5f;color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px;font-family:'Press Start 2P',monospace;font-size:11px;cursor:pointer}
  .gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s}

  /* ═══ LAYOUT: Larry al costado + chat ═══ */
  .app{display:grid;grid-template-columns:330px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
  .chat,.thread{min-height:0}
  .side.dots-bg{background:linear-gradient(rgba(8,10,22,.82),rgba(8,10,22,.82)),#2a79d3 var(--sky) center bottom / cover no-repeat}
  .side{border-right:3px solid #1d1d24;display:flex;flex-direction:column;padding:18px;gap:14px;overflow-y:auto;scrollbar-width:none}
  .side-stage{position:relative;flex:none;height:250px;background:#121218;border:3px solid #2c2c36;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .side-stage::after,.scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#2c2c36 0 12px,#23232b 12px 24px)}
  .side-stage .larry{width:164px;margin-bottom:0}
  .side-stage::after{display:none}
  .st-back,.st-front{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
  .st-back{z-index:0}.st-front{z-index:2}
  .prop{z-index:3!important}
  .sbox{position:relative;flex:none;align-self:stretch;width:170px;margin-left:-18px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-right:3px solid #2c2c36}
  .side-stage .prop.main{left:calc(50% + 52px);top:30px;width:36px}
  .who{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .who b{font-family:'Press Start 2P',monospace;font-size:15px;font-weight:400}
  .stat{font-family:'VT323',monospace;font-size:20px;color:#7fff5f;white-space:nowrap}
  body.typing .stat{color:#ffd54a}
  .handle{font-family:'VT323',monospace;font-size:19px;color:#9a968e;margin-top:-10px}
  .handle a{text-decoration:none;color:#f0ede6}
  .route{display:flex;flex-direction:column;gap:4px}
  .route .lbl{color:#77757f;margin:6px 0 6px}
  .route button{display:flex;gap:10px;align-items:center;width:100%;background:transparent;border:2px solid transparent;color:#d6d2ca;padding:9px 10px;font-size:15px;text-align:left;cursor:pointer}
  .route button:hover{background:#16161d}
  .route button .n{font-family:'Press Start 2P',monospace;font-size:9px;color:#77757f;width:22px;flex:none}
  .route button .s{margin-left:auto;font-size:13px;color:#7fff5f;font-family:'VT323',monospace;font-size:19px}
  .route button.cur{border-color:#fff;background:#18181f;color:#fff;box-shadow:3px 3px 0 #000}
  .route button.lock{opacity:.38;cursor:default}
  .route button.lock:hover{background:transparent}
  .side-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border:2px solid #2c2c36;background:rgba(0,0,0,.25);white-space:nowrap}
  .side-foot .saved,.side-foot .linkbtn{font-size:16px}
  .saved{font-family:'VT323',monospace;font-size:18px;color:#615e58}
  .linkbtn{background:none;border:none;color:#77757f;font-family:'VT323',monospace;font-size:18px;cursor:pointer}
  .linkbtn:hover{color:#fff}

  .chat{display:flex;flex-direction:column;min-width:0;height:100%}
  .chead{flex:none;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1a58b4 var(--sky) left 0 / cover no-repeat;image-rendering:pixelated;border-bottom:3px solid #000}
  .hdl{font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;text-decoration:none;text-shadow:2px 2px 0 #0b2c5c;white-space:nowrap}
  #menuBtn{display:none;background:none;border:2px solid #2c2c36;color:#fff;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
  .mav{display:none;flex:none;width:42px;height:42px;background:#1b1b22;border:2px solid #000;box-shadow:2px 2px 0 #000;overflow:hidden;justify-content:center}
  .mav.larry svg{width:38px;margin-top:2px}
  .ttl{min-width:0;flex:1}
  .ttl b{display:block;font-family:'Press Start 2P',monospace;font-weight:400;font-size:13px;color:#fff;text-shadow:2px 2px 0 #0b2c5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .ttl small{display:inline-block;max-width:100%;margin-top:6px;background:#fff;color:#141414;border:2px solid #000;box-shadow:2px 2px 0 #000;padding:0 8px;font-family:'VT323',monospace;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.typing .ttl small{background:#ffd54a}
  .pbar{flex:none;height:6px;background:#1d1d24}
  .pbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#7fff5f 0 8px,#58d63a 8px 16px);transition:width .5s steps(6)}

  .thread{flex:1;overflow-y:auto;padding:20px 18px 34px}
  .tin{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .intro{text-align:center;padding:16px 0 18px}
  .intro img{width:76px;margin-bottom:14px}
  .intro h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(20px,4vw,34px);line-height:1.45;letter-spacing:0;text-shadow:4px 4px 0 #0b2c5c;color:#fff}
  .intro .byline{font-family:'DM Mono',monospace;font-size:14px;color:#fff;margin:8px 0 12px;text-shadow:2px 2px 0 #0b2c5c}
  .intro .byline a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
  .intro .ps{color:#dbe9ff;text-shadow:1px 1px 0 #0b2c5c}
  .intro img{filter:drop-shadow(2px 2px 0 #0b2c5c)}

  /* mensajes */
  .row{display:flex;gap:10px;align-items:flex-start;animation:msgin .3s steps(4) both}
  .row.u{justify-content:flex-end}
  .row.c{display:block}
  @keyframes msgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .av{flex:none;width:40px;height:40px;background:#1b1b22;border:2px solid #000;box-shadow:2px 2px 0 #000;overflow:hidden;display:flex;justify-content:center}
  .av svg{width:34px;height:auto;margin-top:3px;image-rendering:pixelated}
  .row.l + .row.l .av, .row.l + .row.tmp .av{visibility:hidden}
  .col{min-width:0;max-width:min(560px,84%)}
  .row.wide .col{max-width:min(620px,100%);flex:1}
  .bub{background:#fff;color:#141414;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 14px 11px}
  .bub .vt{font-family:'VT323',monospace;font-size:23px;line-height:1.12}
  .bub .vt + .vt{margin-top:6px}
  .bub .opt{color:#8f897e;font-size:19px}
  .bub .hint{font-size:14.5px;color:#5f5a52;margin-top:6px;line-height:1.42}
  .bub .ex{margin-top:9px;background:#f6f3ec;border:2px dashed #cfc7b7;padding:7px 10px;font-size:14.5px;color:#3d3a35;line-height:1.4}
  .bub .ex strong{font-weight:700;color:#141414}
  .bub .vt b{font-weight:700;color:#000}
  .bub .hint b{font-weight:600;color:#2a2722}
  .bub .vt u,.bub .hint u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .bub.hito{background:#ffd54a;box-shadow:4px 4px 0 #000;position:relative;padding-top:24px}
  .bub.hito::before{content:'★ CLAVE';position:absolute;left:12px;top:8px;font-family:'Press Start 2P',monospace;font-size:7.5px;color:#7a5a00}
  .bub.hito .vt{font-size:27px;line-height:1.08;-webkit-text-stroke:.5px #141414}
  .ladder2{display:flex;flex-direction:column;align-items:center;gap:5px}
  .ladder2 .lv{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;min-height:58px}
  .ladder2 .lv .tx{flex:1;min-width:0;line-height:1.25}
  .ladder2 .lv b{display:block;font-family:'Press Start 2P',monospace;font-weight:400;font-size:8px;letter-spacing:.04em;opacity:.85;margin-bottom:4px}
  .ladder2 .lv i{font-style:normal;display:block;font-size:12.5px;opacity:.85}
  .ladder2 .lv .pp{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;max-width:80px}
  .ladder2 .lv .pp i{width:7px;height:7px;background:currentColor;opacity:.8}
  .ladder2 .lv.me .pp i{width:12px;height:12px;background:#000;opacity:1}
  .ladder2 .lv.me{color:#000;outline:3px dashed #000;outline-offset:3px}
  .ladder2 .lv.me b{opacity:1}
  .ladder2 .arrow{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);margin:8px 0 2px;text-align:center;line-height:1.6}
  .reelsteps{display:grid;gap:8px}
  .reelsteps div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line2);padding:10px 12px}
  .reelsteps .n{flex:none;width:28px;height:28px;background:#151515;color:#fff;font-family:'Press Start 2P',monospace;font-size:10px;display:flex;align-items:center;justify-content:center}
  .reelsteps p{font-size:14.5px;line-height:1.4}
  .reelsteps em{display:block;font-style:normal;margin-top:4px;color:#3d3a35;background:#fff6cf;border-left:3px solid #ffd54a;padding:3px 8px}
  .fpick{margin-top:12px}
  .fpick input{width:100%;background:#fff;border:2px solid #000;color:#151515;padding:11px 13px;font-family:'Barlow';font-size:16px;outline:none}
  .flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px;max-height:260px;overflow:auto}
  .fbtn{background:#fff;border:2px solid var(--line2);color:#151515;padding:10px;text-align:left;cursor:pointer;font-size:18px;line-height:1.1}
  .fbtn small{display:block;font-family:'Barlow',sans-serif;font-size:11px;color:#8f897e;margin-top:4px}
  .fbtn.sel{border-color:#151515;box-shadow:0 0 0 1px #151515 inset;background:#fffbe9}
  .fbtn.use{border-style:dashed}
  .bub b.lb,.bub .ex b.lb{font-weight:700;display:inline;font-family:inherit;font-size:inherit;color:inherit;margin:0;-webkit-text-stroke:.6px currentColor}
  .bub .ex b{display:block;font-family:'Press Start 2P',monospace;font-size:7.5px;color:#8f897e;margin-bottom:5px;font-weight:400}
  .bub .grp{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8.5px;background:#141414;color:#fff;padding:5px 7px;margin-bottom:9px}
  .bub .qn{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7.5px;color:#8f897e;margin-top:6px}
  .bub .fixl{font-size:15px;margin-top:7px;line-height:1.4}
  .bub .fixl b{font-weight:700}
  .bub.err{background:#ffe9e4}
  .typingb{display:inline-flex;gap:6px;padding:14px 16px}
  .typingb i{width:8px;height:8px;background:#141414;animation:tdot 1s steps(1) infinite}
  .typingb i:nth-child(2){animation-delay:.33s}.typingb i:nth-child(3){animation-delay:.66s}
  @keyframes tdot{0%,60%{opacity:.2}30%{opacity:1}}
  .ubub{background:#f3ead8;color:#141414;border:3px solid #000;box-shadow:-4px 4px 0 #000;padding:9px 14px;font-size:16px;white-space:pre-wrap;word-break:break-word;position:relative;line-height:1.42}
  .ubub.ed{cursor:pointer}
  .ubub.ed::after{content:'✎';position:absolute;left:-26px;top:50%;transform:translateY(-50%);font-size:15px;color:#615e58;opacity:0;transition:.15s}
  .ubub.ed:hover::after{opacity:1}
  .ubub .skip{opacity:.55;font-style:italic}
  .ubub .sw{display:inline-flex;gap:5px;vertical-align:middle}
  .ubub .sw i{width:22px;height:22px;border:2px solid #000}

  /* tarjetas dentro del chat (claras) */
  .mcard,.sheet{
    --card:#f6f3ec; --card2:#ece7dc; --line:#e2dccf; --line2:#cfc7b7;
    --text:#151515; --muted:#5f5a52; --dim:#8f897e; --white:#151515;
    background:var(--card);color:var(--text);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:16px}
  .mcard.bare{--text:#f0ede6;--muted:#9a968e;--dim:#615e58;background:transparent;border:none;box-shadow:none;padding:0}
  .mcard h3{font-size:17px;margin-bottom:8px}
  .wfoot{display:flex;justify-content:flex-end;margin-top:14px}
  .btnp{background:#7fff5f;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
  .btnp:active,.qb:active,#csend:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btnw{background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 14px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}

  /* escena de cada parada (animación) */
  .scene{position:relative;height:170px;background:#121218;border:3px solid #2c2c36;overflow:hidden;display:flex;align-items:flex-end;padding:0 18px;gap:22px;margin:20px 0 4px;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px}
  .scene .larry{width:104px;margin-bottom:0;flex:none}
  .scene .prop.main{left:122px;top:12px;width:26px}
  .scene::after{display:none}
  .scene-t{align-self:center;padding-bottom:6px;min-width:0;z-index:1}
  .scene-t .ps{color:#7fff5f}
  .scene-t .ps.dim{color:#77757f}
  .scene-t .iglink{display:inline-block;color:#fff;text-decoration:none;border-bottom:2px solid #7fff5f;padding-bottom:3px}
  .scene-t .iglink:hover{color:#7fff5f}
  .scene-t h3{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(14px,2.6vw,22px);line-height:1.35;color:#fff;margin:10px 0 8px}

  /* barra de abajo */
  .dock{flex:none;background:rgba(10,10,14,.9);backdrop-filter:blur(6px);border-top:3px solid #1d1d24;padding:10px 18px calc(12px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:780px;margin:0 auto}
  .quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .quick:empty{display:none}
  .qb{background:#fff;color:#141414;border:3px solid #000;box-shadow:3px 3px 0 #555;padding:8px 14px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;line-height:1.25}
  .qb small{display:block;font-weight:400;font-size:12.5px;color:#666;font-family:'Barlow',sans-serif;text-transform:none;letter-spacing:0}
  .qb.pri{background:#7fff5f}
  .qb.chip{background:transparent;color:#f0ede6;border:2px solid #3a3a44;box-shadow:none;padding:6px 12px;font-size:14px;font-weight:500}
  .qb.chip:hover{border-color:#aaa}
  .qb.ghost{background:transparent;color:#9a968e;border:2px dashed #3a3a44;box-shadow:none;font-weight:500}
  .dockhint{font-family:'VT323',monospace;font-size:21px;color:#9a968e;align-self:center}
  .composer{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
  .quick:empty + .composer{margin-top:0}
  .composer[hidden]{display:none}
  .composer textarea{flex:1;min-width:0;background:#fff;color:#141414;border:3px solid #000;box-shadow:3px 3px 0 #555;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:16.5px;line-height:1.4;resize:none;max-height:190px;outline:none}
  .composer textarea::placeholder{color:#a9a397}
  #csend{flex:none;width:54px;height:50px;background:#7fff5f;border:3px solid #000;box-shadow:3px 3px 0 #555;font-family:'Press Start 2P',monospace;font-size:15px;cursor:pointer}

  /* editar respuesta */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal[hidden]{display:none}
  .sheet{width:100%;max-width:580px;max-height:86vh;overflow:auto;box-shadow:6px 6px 0 #000;padding:20px}
  .sheet .ps{color:#8f897e}
  .sheet h3{font-family:'VT323',monospace;font-weight:400;font-size:26px;line-height:1.1;margin:8px 0 14px}
  #scrim{display:none}

  /* entradas (en tarjetas y al editar) */
  .wfield input[type=text],.wfield input[type=url],.wfield textarea{width:100%;background:#fff;border:2px solid #000;color:#151515;padding:11px 13px;font-family:'Barlow';font-size:16.5px;line-height:1.5;outline:none}
  .wfield textarea{resize:vertical;min-height:90px}
  .wfield ::placeholder{color:#a9a397}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:2px solid var(--line2);background:#fff;color:var(--text);padding:7px 12px;font-size:14.5px;cursor:pointer;line-height:1.2}
  .chip:hover{border-color:#151515}
  .chip.sel{background:#151515;color:#fff;border-color:#151515}
  .chips-note{font-size:13px;color:var(--dim);margin-top:8px}
  .choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .choice button{background:#fff;border:2px solid var(--line2);color:var(--text);padding:12px;cursor:pointer;text-align:left;font-size:15px}
  .choice button small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .choice button.sel{border-color:#151515;box-shadow:0 0 0 1px #151515 inset}
  .yn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .yn:first-child{border-top:none;padding-top:0}
  .yn span{font-size:15.5px}
  .yn .seg{display:flex;flex:none;border:2px solid #151515}
  .yn .seg button{background:#fff;border:none;color:var(--muted);padding:6px 11px;font-size:14px;cursor:pointer}
  .yn .seg button.sel.si{background:#7fff5f;color:#000}
  .yn .seg button.sel.no{background:#151515;color:#fff}
  .colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .colors label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;text-align:center;line-height:1.2}
  .colors input{appearance:none;-webkit-appearance:none;width:100%;aspect-ratio:1;border:3px solid #000;background:none;cursor:pointer;padding:0}
  .colors input::-webkit-color-swatch-wrapper{padding:0}
  .colors input::-webkit-color-swatch{border:none}
  .colors input::-moz-color-swatch{border:none}
  .mini-btn{background:#fff;border:2px solid var(--line2);color:var(--text);padding:7px 12px;font-size:14px;cursor:pointer;margin-top:10px}
  .mini-btn:hover{border-color:#151515}
  .traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .trap{background:#fff;border:2px solid var(--line2);padding:12px;cursor:pointer;text-align:left;color:var(--text)}
  .trap .e{font-size:22px}
  .trap h4{font-family:'Syne';font-size:15px;margin:6px 0 4px}
  .trap p{font-size:13.5px;color:var(--muted);line-height:1.4}
  .trap.sel{border-color:#151515;box-shadow:0 0 0 1px #151515 inset;background:#fffbe9}

  /* visuales */
  .visual{margin:0}
  .vis-title{margin-bottom:12px;color:var(--muted)}
  .ladder{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ladder div{padding:10px 14px;text-align:center;font-size:14px;border:2px solid var(--line2);background:#fff}
  .ladder div b{display:block;font-family:'DM Mono';font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ladder div i{font-style:normal;color:var(--dim);font-size:12.5px;display:block}
  .ladder .l4{background:#151515;color:#fff;border-color:#151515}
  .ladder .l4 b,.ladder .l4 i{color:#aaa}
  .output{background:#fff;color:#0a0a0a;border:2px solid #000;padding:18px 20px;margin:0}
  .output .mono{color:#666;margin-bottom:8px;display:block}
  .output p{font-family:'Syne';font-weight:700;font-size:19px;line-height:1.35}
  .output .ph{color:#aaa;border-bottom:1.5px dashed #bbb}
  .output .copy{margin-top:12px;background:#0a0a0a;color:#fff;border:none;padding:8px 14px;font-size:14px;cursor:pointer}
  .persona{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--line2);padding:16px}
  .avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--card2);border:2px solid #000;display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:800;font-size:26px}
  .persona h4{font-family:'Syne';font-size:20px}
  .persona p{color:var(--muted);font-size:14.5px}
  .persona .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .persona .tags span{font-size:12.5px;border:1px solid var(--line2);padding:2px 9px}
  .idea{margin-top:10px;background:var(--card2);border:2px dashed var(--line2);padding:14px}
  .idea .mono{color:var(--muted);display:block;margin-bottom:6px}
  .vibe{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .vibe span{font-size:13px;border:1px solid #3a3a44;padding:3px 10px;color:#cfcac1}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pillar{background:#fff;border:2px solid var(--line2);padding:12px}
  .pillar .e{font-size:22px}
  .pillar h4{font-family:'Syne';font-size:15px;margin:6px 0 4px}
  .pillar p{font-size:13.5px;color:var(--muted);line-height:1.4}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
  .week div{background:#fff;border:2px solid var(--line);padding:8px 4px;text-align:center;font-size:12px;min-height:72px}
  .week div b{display:block;font-family:'DM Mono';font-weight:400;font-size:10.5px;color:var(--muted);margin-bottom:6px}
  .week .r{background:#151515;color:#fff;border-color:#151515}
  .week .r b{color:#aaa}
  .week .h{border-style:dashed}
  .note{font-size:14px;color:var(--muted);margin-top:10px}
  .funnel{--muted:#9a968e;--text:#f0ede6;background:#0f0f0f;border:2px solid #000;padding:16px;display:flex;flex-direction:column;gap:6px}
  .f-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center}
  .f-bar{justify-self:center;min-width:max-content;white-space:nowrap;color:#000;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
  .f-bar b{font-weight:800;opacity:.65}
  .f-row p{font-size:14px;color:#cfcac1;line-height:1.4}
  .f-note{font-size:13.5px;color:#9a968e;margin-top:10px;line-height:1.45}
  .f-note a{color:#f0ede6}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
  .chk:first-of-type{border-top:none}
  .box{flex:none;width:22px;height:22px;border:2px solid #151515;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;margin-top:1px}
  .chk.on .box{background:#7fff5f}
  .chk.on .box::after{content:'✓'}
  .chk span{font-size:15.5px}
  .chk small{display:block;color:var(--muted);font-size:13.5px}
  details.deep summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600}
  details.deep summary::-webkit-details-marker{display:none}
  details.deep summary::after{content:'+';font-size:22px;color:var(--muted)}
  details.deep[open] summary::after{content:'–'}
  details.deep .dc{padding-top:10px;font-size:15px}
  details.deep .dc h4{font-family:'Syne';font-size:15px;margin:14px 0 4px}
  details.deep .dc ul{padding-left:18px}
  details.deep .dc li{margin:4px 0}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  .tbl td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
  .tbl td:first-child{color:var(--muted);white-space:nowrap}
  .bcard{padding:24px;border:3px solid #000;box-shadow:4px 4px 0 #000}
  .bcard .mono{opacity:.6}
  .bcard h3{font-weight:800;margin:6px 0 4px}
  .bcard .pos{font-size:16.5px;margin-bottom:18px;opacity:.9}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bgrid > div{border-top:1px solid currentColor;padding-top:10px}
  .bgrid .mono{display:block;margin-bottom:4px}
  .bgrid p{font-size:14.5px;line-height:1.45}
  .sw{display:flex;gap:6px;margin-top:4px}
  .sw i{width:28px;height:28px;border:1px solid rgba(128,128,128,.4)}
  .after{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .after a,.after details{background:#fff;border:2px solid var(--line2);padding:14px;text-decoration:none;display:block}
  .after b{font-family:'Syne';display:block;margin-bottom:4px}
  .after p,.after li{font-size:14px;color:var(--muted)}
  .after summary{cursor:pointer;list-style:none}
  .after summary::-webkit-details-marker{display:none}
  .after ol{padding-left:18px;margin-top:8px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  /* Instagram realista */
  .phone{width:100%;max-width:370px;background:#fff;color:#000;border-radius:38px;border:9px solid #1d1d1f;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.35}
  .ph-status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:13px;letter-spacing:.02em}
  .ph-nav{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 8px;font-size:17px}
  .ph-nav b{font-weight:700;font-size:16px}
  .ph-nav .bk{font-size:26px;line-height:1}
  .ph-head{display:flex;align-items:center;gap:18px;padding:4px 14px}
  .ph-av{flex:none;width:84px;height:84px;border-radius:50%;padding:3px}
  .ph-av > div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph-stats{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:12.5px}
  .ph-stats b{display:block;font-size:16px;font-weight:700}
  .ph-txt{padding:10px 14px 0;font-size:13.5px}
  .ph-txt .cat{color:#737373}
  .ph-txt .lnk{color:#00376b;font-weight:600}
  .ph-btns{display:flex;gap:6px;padding:12px 14px}
  .ph-btns span{flex:1;text-align:center;background:#efefef;border-radius:8px;padding:7px 0;font-weight:600}
  .ph-btns .b1{background:#0095f6;color:#fff}
  .ph-btns .sm{flex:none;width:34px}
  .ph-hl{display:flex;gap:14px;padding:2px 14px 12px}
  .ph-hl div{text-align:center;font-size:11.5px;width:60px}
  .ph-hl i{display:block;width:60px;height:60px;border-radius:50%;border:1px solid #dbdbdb;box-shadow:inset 0 0 0 3px #fff;margin-bottom:4px}
  .ph-tabs{display:flex;border-top:1px solid #efefef}
  .ph-tabs span{flex:1;display:flex;justify-content:center;padding:9px 0;color:#8e8e8e;border-bottom:1px solid transparent}
  .ph-tabs span.on{color:#000;border-bottom-color:#000}
  .ph-tabs svg{width:22px;height:22px}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .ph-grid .t{position:relative;aspect-ratio:3/4;overflow:hidden;isolation:isolate}
  .ph-grid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
  .ph-grid .ph .sh{position:absolute;inset:0;mix-blend-mode:lighten}
  .ph-grid .ico{position:absolute;top:6px;right:6px;width:16px;height:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));z-index:2}
  .ph-grid .views{position:absolute;left:6px;bottom:5px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
  .ph-grid .cap{position:absolute;left:0;right:0;top:42%;text-align:center;color:#fff;font-size:12px;line-height:1.1;padding:0 6px;text-shadow:0 1px 6px rgba(0,0,0,.6);z-index:2}
  .ph-grid .tx{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;gap:5px}
  .ph-grid .tx .big{font-size:16px;line-height:1.05;word-break:break-word}
  .ph-grid .tx .sub{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .ph-grid .tx .quote{font-size:12.5px;line-height:1.2}
  .feedwrap .output{max-width:370px;margin-top:14px}
  .feedwrap .note{color:#77757f;font-size:12px}
  @media (max-width:560px){ .phone{border-width:7px;border-radius:30px} .ph-head{gap:10px;padding:4px 10px} .ph-av{width:64px;height:64px} .ph-stats{font-size:10.5px} .ph-stats b{font-size:14px} .ph-hl{gap:8px;padding:2px 10px 12px} .ph-hl div{width:50px;font-size:10.5px} .ph-hl i{width:50px;height:50px} .ph-txt,.ph-btns{padding-left:10px;padding-right:10px} }

  /* Larry pixel */
  .larry{position:relative;flex:none;z-index:1}
  .larry .bob{animation:bob 1.1s steps(2) infinite}
  .larry svg{display:none;width:100%;height:auto;image-rendering:pixelated}
  .larry[data-frame="base"] svg[data-f="base"],.larry[data-frame="blink"] svg[data-f="blink"],.larry[data-frame="talk"] svg[data-f="talk"],
  .larry[data-frame="blinktalk"] svg[data-f="blinktalk"],.larry[data-frame="up"] svg[data-f="up"]{display:block}
  .prop{position:absolute;z-index:2;image-rendering:pixelated;animation:float 1.4s steps(3) infinite}
  .prop svg{width:100%;height:auto;display:block}
  .rec{position:absolute;top:10px;right:12px;font-family:'Press Start 2P',monospace;font-size:9px;color:#ff4d6d;animation:blinkr 1s steps(1) infinite;z-index:2}
  .spark{position:absolute;z-index:2;animation:float 1.4s steps(3) infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes blinkr{50%{opacity:0}}
  @keyframes in-slide{0%{transform:translateX(-170%)}100%{transform:none}}
  @keyframes in-jump{0%{transform:translateY(110%)}55%{transform:translateY(-22%)}78%{transform:translateY(4%)}100%{transform:none}}
  @keyframes in-pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes in-rise{0%{transform:translateY(100%);opacity:0}100%{transform:none;opacity:1}}
  .in-slide{animation:in-slide .7s steps(7) both}
  .in-jump{animation:in-jump .75s steps(8) both}
  .in-pop{animation:in-pop .5s steps(5) both}
  .in-rise{animation:in-rise .8s steps(8) both}
  .prop.in{animation:in-pop .4s steps(4) .6s both, float 1.4s steps(3) 1s infinite}
  .scene-t.in{animation:in-pop .4s steps(4) .35s both}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:7px 14px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:95}
  .toast.on{opacity:1}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);z-index:85;transform:translateX(-105%);transition:transform .25s steps(5)}
    body.menu .side{transform:none}
    body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:84}
    #menuBtn,.mav{display:flex;align-items:flex-start}
    #menuBtn{align-items:center;justify-content:center}
    .ttl .hd,.hdl{display:none}
    .ttl b{font-size:11px}
  }
  @media (max-width:560px){
    body{font-size:16px}
    .thread{padding:16px 12px 28px}
    .chead{padding:8px 12px}
    .dock{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
    .col{max-width:88%}
    .av{width:34px;height:34px}.av svg{width:28px}
    .bub .vt{font-size:21px}
    .scene{height:138px;padding:0 12px;gap:12px}
    .sbox{width:118px;margin-left:-12px}
    .scene .larry{width:84px;margin-bottom:0}
    .scene .prop.main{left:86px;top:8px;width:20px}
    .scene-t{padding-left:4px}
    .pillars,.bgrid,.after{grid-template-columns:1fr}
    .week{gap:3px}.week div{font-size:10.5px;padding:6px 2px}
    .f-row{grid-template-columns:1fr;gap:6px;margin-bottom:8px}
    .f-bar{justify-self:start}
    .quick{justify-content:flex-start}
    .ubub.ed::after{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .larry .bob,.prop,.in-slide,.in-jump,.in-pop,.in-rise,.prop.in,.row,.scene-t.in,.spark{animation:none!important}
  }

  /* imprimir: tarjeta + respuestas */
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff;color:#111}
    body > *:not(#printArea){display:none !important}
    #printArea{display:block;padding:24px;font-family:'Barlow',sans-serif}
    #printArea .bcard{break-inside:avoid;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printArea h4{font-family:'Syne';font-size:16px;margin:22px 0 8px;border-bottom:2px solid #111;padding-bottom:4px}
    #printArea .qa{margin:0 0 10px;break-inside:avoid}
    #printArea .qa div:first-child{font-size:12.5px;color:#555;font-weight:600}
    #printArea .qa div:last-child{font-size:14px;white-space:pre-wrap}
  }
</style>

// Cielo celeste con nubes en pixel art: se dibuja chiquito (200×125) y se agranda sin suavizar.
(function () {
  const Wd = 200, Hd = 125, c = document.createElement("canvas");
  c.width = Wd; c.height = Hd;
  const g = c.getContext("2d");
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  // cielo en franjas limpias, con una fila tramada en cada cambio
  const SKY = ["#1a58b4","#1e62bf","#236cc8","#2977d1","#3082d9","#388ddf","#4198e4"];
  const band = Hd / SKY.length;
  for (let y = 0; y < Hd; y++) { const i = Math.min(SKY.length - 1, Math.floor(y / band)); const edge = i > 0 && y === Math.floor(i * band);
    for (let x = 0; x < Wd; x++) px(x, y, edge && x % 2 ? SKY[i - 1] : SKY[i]); }
  // nubes = bollos; los de adelante tapan a los de atrás
  const B = [];
  function cumulus(cx, base, w, h, tiers) {
    for (let t = 0; t < tiers; t++) {
      const tw = w * (0.4 + 0.6 * t / Math.max(1, tiers - 1)), n = 2 + t * 2;
      for (let k = 0; k < n; k++) {
        const x = cx - tw / 2 + (k + 0.5) * tw / n + (rnd() - 0.5) * 5;
        const prof = Math.max(0.15, Math.sin(Math.min(1, Math.max(0, (x - (cx - w / 2)) / w)) * Math.PI));
        const r = Math.max(3.2, (h * 0.22 + rnd() * h * 0.12) * (0.65 + 0.55 * prof));
        const y = base - h * (1 - t / tiers) * 0.8 * prof - r * 0.2 + (rnd() - 0.5) * 3;
        B.push({ x, y, r, z: t * 100 + rnd() });
      }
    }
  }
  cumulus(132, 128, 150, 62, 5);
  cumulus(30, 130, 80, 30, 3);
  cumulus(188, 100, 36, 20, 2);

/* El logo viene en blanco sobre negro: lo paso a fondo transparente (anda igual en iPhone, Android y compu). */
let LOGO_A = null;
(function(){ const im = new Image(); im.onload = () => { try {
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0); const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const l = Math.max(a[i], a[i+1], a[i+2]); a[i+3] = l; a[i] = a[i+1] = a[i+2] = 255; }
  g.putImageData(d, 0, 0); LOGO_A = c.toDataURL('image/png');
} catch(e) { LOGO_A = LOGO; }
  document.querySelectorAll('img.logo').forEach(el => { el.src = LOGO_A; el.style.opacity = ''; }); };
  im.src = LOGO; })();

function pixelSVG(rows, pal, extra){
  const w = rows[0].length, h = rows.length;
  let out = '';
  rows.forEach((row, y) => {
    if (row.length !== w) throw new Error('fila ' + y + ' mide ' + row.length);
    let x = 0;
    while (x < w) {
      const ch = row[x];
      let n = 1; while (x + n < w && row[x + n] === ch) n++;
      if (ch !== '.') out += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + pal[ch] + '"/>';
      x += n;
    }
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" ' + (extra || '') + '>' + out + '</svg>';
}

/* ESTUDIO EN PIXEL ART — el estudio real de Larry: ventanales con vista al mar y la montaña,
   Poly D + controlador blanco, guitarra, ficus y escritorio con laptop. Larry va adelante, de medio cuerpo. */
function studioLayers(){
  const W = 60, H = 58; let back = '';
  const R = (x,y,w,h,c) => { back += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>'; };
  let sd = 5; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const disc = (cx,cy,r,c) => { for(let y=Math.floor(cy-r);y<=cy+r;y++) for(let x=Math.floor(cx-r);x<=cx+r;x++) if(Math.hypot(x+.5-cx,y+.5-cy)<=r) R(x,y,1,1,c); };
  // cielo celeste con nubes, como el fondo del manual
  ['#1f65c2','#246fcb','#2a79d3','#3184da','#3a8fe0'].forEach((c,i)=>R(0,i*3,W,i===4?28:3,c));
  const cl = (cx,cy,w) => { for(let k=0;k<w;k++){ const r = 1.2 + 1.8*Math.sin(k/(w-1)*Math.PI); disc(cx-w/2+k, cy, r, '#e6eef8'); } for(let k=0;k<w;k++){ const r = 0.8 + 1.4*Math.sin(k/(w-1)*Math.PI); disc(cx-w/2+k-0.5, cy-0.8, r, '#ffffff'); } };
  cl(10,7,9); cl(31,5,7); cl(46,9,6);
  // montañas y mar
  for(let x=0;x<W;x++){ const h = 13 + Math.round(2*Math.sin(x*0.23)+Math.sin(x*0.61)); R(x,h,1,6,x%3?'#6f8a6a':'#65805f'); }
  R(38,16,22,5,'#5fa3b4'); R(38,16,22,1,'#7fbccb'); R(44,18,6,1,'#7fbccb');
  // pinos
  [[3,20,4],[9,18,4.5],[15,21,4],[30,21,3.5],[36,22,3]].forEach(([x,y,r])=>{ disc(x,y,r,'#2f5a34'); disc(x-1,y-1,r*0.6,'#3e7044'); });
  R(0,24,W,16,'#355f39'); for(let i=0;i<40;i++) disc(rnd()*W, 24+rnd()*14, 1.5+rnd()*1.5, rnd()<.5?'#2f5a34':'#447a48');
  // edificio a la derecha
  R(51,2,9,38,'#e6d6b4'); for(let y=4;y<36;y+=4){ R(53,y,2,2,'#bcae8f'); R(57,y,2,2,'#bcae8f'); }
  // marcos de los ventanales y baranda
  [[0,2],[19,2],[39,2],[58,2]].forEach(([x,w])=>R(x,0,w,40,'#3a2a20')); R(0,0,W,1,'#3a2a20');
  R(0,27,W,1,'#2a2a2a'); R(0,33,W,1,'#2a2a2a');
  R(0,38,W,2,'#4a3628');
  // pared baja y piso de baldosas
  R(0,40,W,8,'#ece4d4'); R(0,47,W,1,'#c9bfae');
  R(0,48,W,10,'#ddd7cb'); for(let x=0;x<W;x+=6) R(x,48,1,10,'#c9c2b4'); R(0,52,W,1,'#c9c2b4');
  // guitarra
  R(1,29,1,8,'#c79a3c'); R(0,28,3,2,'#c79a3c'); disc(1.5,42,2.6,'#a8622e'); disc(1.5,46,3.2,'#a8622e'); disc(1.5,43.5,0.8,'#2a1a10');
  // ficus
  R(20,28,1,17,'#6b4a2c'); R(18,44,5,4,'#151515');
  for(let i=0;i<70;i++){ const x=14+rnd()*12, y=6+rnd()*26; R(Math.floor(x),Math.floor(y),2,1,['#3f8f3a','#56a84a','#2f6e2c'][Math.floor(rnd()*3)]); }
  // soporte X
  for(let i=0;i<9;i++){ R(6+i,39+i,1,1,'#222'); R(15-i,39+i,1,1,'#222'); }
  // Poly D (madera + panel negro con perillas) y controlador blanco
  R(3,24,1,6,'#8a5a2e'); R(16,24,1,6,'#8a5a2e'); R(4,24,12,4,'#1d1d1d');
  for(let x=5;x<15;x+=2) R(x,25,1,1,'#9a9a9a'); R(6,26,1,1,'#e07a3a'); R(10,26,1,1,'#3aa6a0'); R(12,26,1,1,'#e07a3a');
  R(4,28,12,2,'#f1f1f1'); for(let x=5;x<15;x+=2) R(x,28,1,1,'#111');
  R(3,34,14,1,'#ffffff'); R(3,35,14,2,'#e4e4e4'); for(let x=4;x<16;x+=2) R(x,35,1,1,'#222'); R(3,37,14,1,'#b9b9b9');
  // escritorio, laptop, parlantes, micrófono y botella
  R(41,32,18,2,'#d8c39d'); R(41,34,18,1,'#b9a37c'); R(43,35,1,13,'#e8e8e8'); R(56,35,1,13,'#e8e8e8');
  R(47,25,8,7,'#222'); R(48,26,6,5,'#f4f4f4'); for(let y=27;y<31;y++) R(49,y,4,1,'#c4c4c4'); R(46,31,10,1,'#333');
  R(42,28,3,4,'#151515'); R(43,29,1,1,'#555'); R(56,28,2,4,'#151515');
  R(45,20,1,7,'#111'); R(43,22,2,4,'#2a2a2a');
  // mate con bombilla
  R(51,30,5,2,'#7a4a22'); R(52,32,3,1,'#5a3418'); R(51,29,5,1,'#c9a05a'); R(52,28,3,1,'#6b8f2c'); R(53,28,1,1,'#7fa83a');
  R(54,24,1,5,'#d9dde3'); R(55,24,1,1,'#d9dde3');
  const svg = '<svg class="st-back" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges">'+back+'</svg>';
  return { back: svg, front: '' };
}

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1700); }

function raw(id){ const v=S[id]; if(Array.isArray(v)) return v.filter(Boolean).join(', '); return (v||'').toString().trim(); }

function filled(f){
  const v = S[f.id];

  if(f.kind==='traps') return Array.isArray(v) && v.length>0 || S[f.id+'_none'];

}

/* ════════════════════════════════════════════════════════════════════
   EL GUION DEL CHAT — se arma solo a partir de STEPS
   say = Larry habla · ask = pregunta · card = tarjeta · chapter = animación de parada
   go = botón para seguir · send = envío final
   ════════════════════════════════════════════════════════════════════ */
const AFTER = {
  p_nombre: [{k:'say', fn:()=>'¡Un gusto, **'+(val('p_nombre')||'artista')+'**! 🤝 Antes de nada, __quiero conocerte un poco.__'}],
  p_quien: [{k:'say', t:'Guardado. **Acá suele estar lo que te hace distinto,** __lo vamos a usar en todo el manual.__ Ahora, una foto rápida de dónde estás hoy.'}],
  d_traps: [{k:'say', html:()=>{ const f=fieldOf('d_traps'); const sel=(S.d_traps||[]).filter(x=>x!==NS);
    if(!sel.length) return '<p class="vt">¡Bien ahí! <b>Seguimos.</b></p>';
    return '<p class="vt">Tranqui, <b>nos pasa a casi todos.</b> Así salís:</p>'+f.items.filter(t=>sel.includes(t.t)).map(t=>'<p class="fixl">'+t.e+' <b>'+esc(t.t)+'</b> '+esc(t.fix)+'</p>').join(''); }}],
  s_persp: [{k:'say', t:'Con todo eso te armé **tu frase de posicionamiento.** __Si cambiás algo, se actualiza sola.__'},{k:'card', card:'pos'}],
  o_momento: [{k:'say', fn:()=>{ const m=arr('o_momento')[0]; return m&&IDEAS[m] ? '💡 **Idea de reel:** '+IDEAS[m] : 'Anotado 👌'; }}],
  o_siente: [{k:'say', t:'!Esta es tu oyente: a ella le hablás en cada video.'},{k:'card', card:'persona'}],
  v_colores: [{k:'say', t:'Mirá, **así se vería tu Instagram** con esos colores 👇 Lo que elijas de acá en adelante __lo va cambiando.__'},{k:'card', card:'feed'}],
  p_cta: [{k:'say', t:'¡Listo! **Tu bio en 3 partes:** __qué sos, para quién cantás y la llamada a la acción.__ Copiala tal cual:'},{k:'card', card:'bio'}],
  p_fij3: [{k:'say', t:'Así queda **tu perfil completo,** con tus __3 videos fijados__ arriba 📌'},{k:'card', card:'feed'}],
  c_gancho: [{k:'say', t:'Con eso ya tenés **tu primer reel.** Siempre se arma igual, en __4 pasos:__'},{k:'card', card:'reel'}],
  c_formatos: [{k:'say', t:'Y esto es clave: **cada video le habla a un tipo de persona distinta.** __Mirá el embudo por colores:__'},{k:'card', card:'funnel'},
    {k:'say', t:'**Cada reel subilo a las 4 redes:** Instagram, TikTok, YouTube Shorts y Facebook. Y ojo: __los primeros 1 o 2 meses suele ir flojo,__ porque el algoritmo todavía no sabe quién sos. __Con 2 o 3 reels por semana__ empieza a entenderte. **No aflojes.**'}],
  n_5: [{k:'say', t:'Gracias por la honestidad. **Eso es tu norte:** __volvé a leerlo cuando dudes.__'}]
};
function buildScript(){
  const B = [];
  GUIDE_COVER.lines.forEach(t=>B.push({k:'say', t}));
  B.push({k:'go', label:'¡Arrancamos! →'});
  STEPS.forEach((st, si)=>{
    B.push({k:'chapter', st, si});
    st.guide.lines.forEach(t=>B.push({k:'say', t}));
    if(st.visual==='ladder' || st.visual==='pillars') B.push({k:'card', card:st.visual});
    if(st.deep) B.push({k:'card', card:'deep', st});
    let prevG = null;
    st.fields.forEach(f=>{
      const grp = f.group && f.group!==prevG ? f.group : null; prevG = f.group || prevG;
      if(f.kind==='yesno'){
        B.push({k:'say', html:()=>'<p class="vt">'+esc(f.label)+'</p>'+(f.hint?'<p class="hint">'+fmt(f.hint)+'</p>':'')});
        f.items.forEach((it,k)=>B.push({k:'ask', f, sub:k}));
      } else B.push({k:'ask', f, grp});
      (AFTER[f.id]||[]).forEach(c=>B.push(c));
    });
    if(st.done) B.push({k:'card', card:'done', st});
    if(si<STEPS.length-1) B.push({k:'go', label:'Siguiente parada: '+STEPS[si+1].t+' →'});
  });
  B.push({k:'say', t:'**Antes de ver tu tarjeta,** necesito que me pegues **el link de tu carpeta de Drive** __que te mandé por WhatsApp.__'});
  B.push({k:'say', html:()=>'<p class="vt">Ahí subo <b>todo lo que armamos,</b> a tu carpeta en la nube. Y con eso trabajamos tu lanzamiento.</p><p class="hint">Abrí la carpeta desde el link de WhatsApp → tocá <b>⋮</b> o <b>Compartir</b> → <b>Copiar enlace</b> → pegalo acá abajo.</p>'});
  B.push({k:'send'});
  B.push({k:'go', label:'Ver mi tarjeta ★'});
  B.push({k:'chapter', final:true});
  GUIDE_FINAL.lines.forEach(t=>B.push({k:'say', t}));
  B.push({k:'card', card:'bcard'});
  return B;
}

function textLen(b){ return b.t ? b.t.replace(/\*/g,'').length : 90; }

function sceneHTML(b, live){

const NS = 'Todavía no lo sé';
/* **…** = negrita (lo más importante: títulos, nombres, frases clave) · __…__ = subrayado (lo secundario) */
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>'); }
function lunaB(h){ return h.replace(/>([^<]*)/g, (m, t) => '>' + t.replace(/\bLuna\b/g, '<b class="lb">Luna</b>')); }

/* ── el motor ── */
let RUN = 0;
async function stepFrom(i){
  const my = ++RUN; closeInput();
  while(i < SCRIPT.length){
    const b = SCRIPT[i];
    if(b.k==='go'){ pos = i; savePos(); openInput(i); return; }
    if(b.k==='chapter'){ await wait(250); if(my!==RUN) return; larryPart(b, true); toBottom(); pos = ++i; savePos(); await wait(950); if(my!==RUN) return; continue; }
    await typing(b.k==='card' ? 550 : (b.k==='send' ? 0 : durOf(b))); if(my!==RUN) return;
    if(b.k==='send'){ pos = i; savePos(); openInput(i); return; }
    larryPart(b, true); toBottom();
    if(b.k==='ask'){ pos = i; savePos(); openInput(i); return; }
    pos = ++i; savePos(); await wait(260); if(my!==RUN) return;
  }
  pos = SCRIPT.length; savePos(); openInput(-1);
}
function finish(i, fn){
  closeInput(); fn(); toBottom();
  pos = i+1; savePos(); setTimeout(()=>stepFrom(i+1), 320);
}

/* ── la barra de abajo: botones rápidos o caja de texto ── */
let SEND = null;
function closeInput(){ quick.innerHTML = ''; comp.hidden = true; SEND = null; }
function qb(label, cls, fn, small, style){
  const b = document.createElement('button'); b.type='button'; b.className = 'qb '+(cls||'');
  if(style) b.setAttribute('style', style);
  b.innerHTML = esc(label)+(small?'<small>'+esc(small)+'</small>':''); b.onclick = fn; quick.appendChild(b); return b;
}
function hintLine(t){ quick.innerHTML = '<span class="dockhint">'+t+'</span>'; }
function openComposer(ph, valNow, onSend){
  comp.hidden = false; cin.value = valNow||''; cin.placeholder = ph || 'Escribí acá…'; grow(); SEND = onSend;
  if(!TOUCH) setTimeout(()=>cin.focus(), 30);
}
function openInput(i){
  closeInput();
  if(i<0){ hintLine('¿Querés cambiar algo? Tocá cualquiera de tus respuestas.'); if(S._pdf && !S._sent) qb('⬇ Descargar en PDF','',printAll); return; }
  const b = SCRIPT[i];
  if(b.k==='go'){ qb(b.label, 'pri', ()=>finish(i, ()=>row('u','<div class="ubub">'+esc(b.label)+'</div>'))); return; }
  if(b.k==='send'){ openSend(i); return; }
  const f = b.f;
  if(b.sub!=null){
    const pick = v => finish(i, ()=>{ const o=S[f.id]||{}; o[b.sub]=v; S[f.id]=o; save(); userAns(f, b.sub); });
    qb('Sí', '', ()=>pick('si')); qb('Todavía no', '', ()=>pick('no')); return;
  }
  const skip = ()=>finish(i, ()=>userAns(f));
  const nose = (pre)=>()=>finish(i, ()=>{ if(pre) pre(); S[f.id] = (f.kind==='chips'||f.kind==='traps') ? [NS] : NS; if(f.kind==='traps') S[f.id+'_none']=false; save(); refreshLive(); userAns(f); });
  if(f.kind==='text' || f.kind==='suggest' || f.kind==='area'){
    if(f.kind==='suggest') f.chips.forEach(c=>qb(c, 'chip', ()=>{ const cur=cin.value.trim(); cin.value = cur ? (cur.includes(c)?cur:cur+' + '+c) : c+' '; grow(); cin.focus(); }));
    if(f.tpl) qb('✨ Armar borrador con mis respuestas', 'chip', ()=>{ cin.value = spotifyDraft(); grow(); cin.focus(); toast('Borrador listo: cambialo a tu manera'); });
    qb('🤷 '+NS, 'ghost', nose());
    if(f.opt) qb('Saltar →', 'ghost', skip);
    openComposer(f.ph || (f.kind==='area' ? 'Escribí como te salga…' : 'Escribí acá…'), S[f.id], ()=>{
      const v = cin.value.trim(); if(!v){ toast(f.opt ? 'Escribí algo o tocá Saltar' : 'Escribí tu respuesta (mirá el ejemplo de Luna)'); return; }
      finish(i, ()=>{ S[f.id]=v; save(); refreshLive(); userAns(f); });
    });
    return;
  }
  if(f.kind==='choice'){
    if(f.id==='v_tipo') qb('🔎 Buscar otra tipografía', 'chip', ()=>openFontPicker(i));
    f.options.forEach(o=>qb(o.v, '', ()=>finish(i, ()=>{ S[f.id]=o.v; save(); refreshLive(); userAns(f); }), o.s, f.id==='v_tipo' ? fontStyle(o.v).replace(/font-size:[^;]+;?/,'') : ''));
    qb('🤷 '+NS, 'ghost', nose());
    if(f.opt) qb('Saltar →', 'ghost', skip);
    return;
  }
  // chips · colors · traps → tarjeta para elegir dentro del chat
  const w = row('l', '<div class="mcard"><div class="wfield" data-field="'+f.id+'">'+inputHTML(f)+'</div><div class="wfoot"><button class="btnp" type="button">Listo ✓</button></div></div>', 'wide');
  toBottom();
  hintLine('Elegí arriba y tocá <b style="color:#7fff5f">Listo</b> ↑');
  qb(f.kind==='colors' ? '🤷 '+NS+' (dejo estos)' : '🤷 '+NS, 'ghost', f.kind==='colors' ? ()=>finish(i, ()=>{ w.remove(); save(); userAns(f); }) : nose(()=>w.remove()));

function inputHTML(f){
  const v = S[f.id];
  if(f.kind==='text' || f.kind==='suggest') return `<input type="text" data-f="${f.id}" value="${esc(v||'')}" placeholder="${esc(f.ph||'Escribí acá')}">`
      + (f.kind==='suggest' ? `<div class="chips" style="margin-top:10px">${f.chips.map(c=>`<button class="chip" type="button" data-ins="${f.id}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : '');
  if(f.kind==='area') return `<textarea data-f="${f.id}" rows="${f.tall?6:4}" placeholder="${esc(f.ph||'Escribí acá, como te salga')}">${esc(v||'')}</textarea>`;
  if(f.kind==='chips'){
    const sel = v||[]; const custom = sel.filter(x=>!f.chips.includes(x));
    return `<div class="chips">${[...f.chips,...custom].map(c=>`<button type="button" class="chip ${sel.includes(c)?'sel':''}" data-tog="${f.id}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
      + `<input type="text" class="other" data-other="${f.id}" placeholder="+ Otra: escribila y tocá Enter" style="margin-top:10px">`
      + (f.max ? `<div class="chips-note">Elegí hasta ${f.max} · ${sel.length}/${f.max}</div>` : '');
  }
  if(f.kind==='choice') return `<div class="choice">${f.options.map(o=>`<button type="button" class="${v===o.v?'sel':''}" data-ch="${f.id}" data-v="${esc(o.v)}" ${f.id==='v_tipo'?`style="${fontStyle(o.v)}"`:''}>${esc(o.v)}<small style="font-family:Barlow;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px">${esc(o.s||'')}</small></button>`).join('')}</div>`;
  if(f.kind==='colors'){ const names=['Fondo','Texto','Color que resalta','Ropa y decorado'];
    return `<div class="colors">${S.v_colores.map((c,k)=>`<label><input type="color" data-color="${k}" value="${c}">${names[k]}</label>`).join('')}</div>`; }
  if(f.kind==='yesno'){ const o = v||{};
    return `<div>${f.items.map((it,k)=>`<div class="yn"><span>${esc(it)}</span><div class="seg"><button type="button" class="${o[k]==='si'?'sel si':''} si" data-yn="${f.id}" data-k="${k}" data-v="si">Sí</button><button type="button" class="${o[k]==='no'?'sel no':''} no" data-yn="${f.id}" data-k="${k}" data-v="no">Todavía no</button></div></div>`).join('')}</div>`; }
  if(f.kind==='traps'){ const sel = v||[];
    return `<div class="traps">${f.items.map(t=>`<button type="button" class="trap ${sel.includes(t.t)?'sel':''}" data-tog="${f.id}" data-v="${esc(t.t)}"><div class="e">${t.e}</div><h4>${esc(t.t)}</h4><p>${esc(t.d)}</p></button>`).join('')}</div>
      <button type="button" class="mini-btn" data-none="${f.id}">${S[f.id+'_none']?'✓ ':''}No caigo en ninguna</button>`; }
  return '';
}

function buildProfilePrompt(contextText){
    return 'Sos un estratega de marca musical. A partir de las respuestas reales de un ' +

      '2. AUTORIDAD — Mostrar en lo que me destaco\n' +
      '3. CONFIANZA — Mostrar las reacciones de las personas\n\n' +
      'Para cada pilar escribí 2-3 párrafos breves y concretos, basados ÚNICAMENTE en lo que el ' +
      'artista realmente escribió abajo — no inventes géneros, logros ni datos que no estén ' +
      'mencionados. Si no hay información suficiente para un pilar, decilo con honestidad y sugerí ' +

      'Respuestas del artista:\n---\n' + contextText + '\n---';
  }

  const MARCO_TEORICO_MANUAL = `
1. IDENTIDAD ARTÍSTICA — Antes de crear contenido, un artista tiene que tener claros 4 puntos, de forma concreta y no vaga:
   - Mensaje/Temática: de qué habla su música. "Amor" no es un mensaje — "crecer en una ciudad que no te entiende" sí lo es.
   - Oyente Ideal: a quién le habla — una persona concreta (edad, dónde vive, qué escucha, en qué momento pone su música), no "todo el mundo".
   - Mood: qué sensación transmite, alineada con el mensaje. Si la música habla de desamor nocturno pero el contenido se ve fiestero, hay una contradicción que el oyente siente aunque no la sepa explicar.
   - Estética: qué vestimenta, paleta de colores y elementos lo representan. No es vanidad — es lo que decide si alguien abre su video o sigue scrolleando.

2. POSICIONAMIENTO — La respuesta a "¿por qué yo y no cualquier otro artista de mi género?" se construye en 3 ejes:
   - Sonido / micro-nicho: género + subgénero + referencias, con precisión. Cuanto más específico el micro-nicho, menos competencia y más posibilidades reales de conectar.
   - Historia: la narrativa personal que conecta su vida con su música — de dónde viene, qué vivió, qué lo llevó a hacer lo que hace.
   - Perspectiva: su postura sobre la música, la industria o la vida — opiniones directas respaldadas por su experiencia real. Sin esto, es uno más en el montón.

3. OYENTE IDEAL — Se define por sus dolores (qué le falta, qué necesita) y sus deseos (qué busca sentir), no solo por datos demográficos genéricos.

4. TRES PILARES DE CONTENIDO — Todo el contenido de un artista debería caer en alguno de estos 3 pilares:

   - Conocimiento: mostrar en qué se destaca, lo que sabe hacer, lo que puede enseñar o aportar.

5. PRINCIPIO GENERAL — "No buscás virales, buscás fans": el objetivo no es la viralidad genérica sino construir una comunidad real que se identifique específicamente con su identidad — gente que lo elige a él, no contenido que le podría gustar a cualquiera.
`.trim();

  function buildContextPromptPrompt(contextText){
    return 'Sos un estratega de marca musical que conoce a fondo el siguiente marco teórico ' +

function doSend(i, driveLink){
  const artista = val('p_nombre') || 'Artista sin nombre';
  const msg = row('l','<div class="bub"><p class="vt">Armando tu perfil de artista… (1 de 3)</p></div>'); toBottom();
  const set = t => { msg.querySelector('.vt').textContent = t; };
  setTalking(true);
  const capitulos = gatherManualData();
  const contextText = buildContextText(capitulos);
  let perfilTexto=null, promptTexto=null;
  const chain = !contextText.trim() ? Promise.resolve() :
    callGeminiClient(buildProfilePrompt(contextText),4096).then(t=>{perfilTexto=t;}).catch(()=>{})
    .then(()=>{ set('Armando tu prompt para IA… (2 de 3)'); return callGeminiClient(buildContextPromptPrompt(contextText),8192).then(t=>{promptTexto=t;}).catch(()=>{}); });
  chain.then(()=>{
    set('Subiendo todo a tu Drive… (3 de 3)');
    return fetch(MANUAL_APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({artista,driveLink,capitulos,perfilTexto,promptTexto})})
      .then(r=>r.json()).then(res=>{
        setTalking(false);
        if(res&&res.ok){ S._sent = driveLink; save(); avisarPortal(); set('¡Subido! 🎉'); successCard(); toBottom(); pos = i+1; savePos(); setTimeout(()=>stepFrom(i+1), 500); }
        else fail((res&&res.error)||'No se pudo enviar. Revisá el link de la carpeta.');
      });
  }).catch(()=>fail('No se pudo conectar. Puede ser tu internet.'));
  function fail(m){
    setTalking(false); set('Uy, falló: '+m); msg.querySelector('.bub').classList.add('err');
    pdfFailCard(); toBottom(); SEND_FAILED = true; openInput(i);
  }
}

function printAll(){
  const caps = gatherManualData();
  let h = bcardHTML();
  caps.forEach(c=>{
    h += `<h4>${esc(c.titulo)}</h4>`;
    c.ejercicios[0].preguntas.forEach(p=>{ h += `<div class="qa"><div>${esc(p.pregunta)}</div><div>${p.respuesta?esc(p.respuesta):'<span style="color:#bbb">—</span>'}</div></div>`; });
    if(c.checklist) h += `<div class="qa"><div>${esc(c.checklist.titulo)}</div><div>${c.checklist.items.map(it=>(it.marcado?'☑ ':'☐ ')+esc(it.texto)).join('\n')}</div></div>`;
  });
  $('#printArea').innerHTML = h;
  setTimeout(()=>window.print(), 50);
}

/* Artist OS: cuando el manual queda enviado, le avisa al portal del artista (abre la llamada de artista).
   El portal abre el manual con ?t=<código del artista>; sin código no hace nada. */
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbz2cB4X2HBLzrGztUKyjp5yrcAblvN2K0I8_36XjRLgE4F60WCrgR9cX3k_IuN22N72UA/exec";
function avisarPortal(){
  try {
    const t = new URLSearchParams(location.search).get('t') || localStorage.getItem('larryos:t');
    if(!t || t === 'demo') return;
    fetch(PORTAL_URL + '?t=' + encodeURIComponent(t) + '&evento=manual', { mode:'no-cors' }).catch(()=>{});
  } catch(e){}
}
function rebuild(){
  if(S._sent) avisarPortal();   // por si lo envió antes de que existiera el aviso
  if(S.v_tipo) fontStyle(S.v_tipo);
  tin.innerHTML = '<div class="intro"><img class="logo" src="'+(LOGO_A||LOGO)+'" alt="Larry Prod"'+(LOGO_A?'':' style="opacity:0"')+'><h1>Tu marca en '+STEPS.length+' pasos.</h1><div class="byline">by <a href="https://www.instagram.com/larry.prod" target="_blank" rel="noopener">@larry.prod</a></div><div class="ps">CHAT PRIVADO · SE GUARDA SOLO</div></div>'
    + (()=>{ const ST = studioLayers(); return '<div class="scene" id="sc-cover"><div class="sbox">'+ST.back+'<div class="larry" data-frame="base"><div class="bob">'+LARRY_SVG.base+'</div></div>'+propHTML(GUIDE_COVER,'')+'</div><div class="scene-t"><span class="ps">TU GUÍA</span><h3>Larry</h3><a class="ps dim iglink" href="https://www.instagram.com/larry.prod" target="_blank" rel="noopener">PRODUCTOR · @LARRY.PROD ↗</a></div></div>'; })();
  setSide(null, true);
  pos = Math.min(pos, SCRIPT.length);
  for(let i=0; i<pos; i++){
    const b = SCRIPT[i];
    if(b.k==='go'){ row('u','<div class="ubub">'+esc(b.label)+'</div>'); continue; }
    if(b.k==='send'){ if(S._sent){ row('u','<div class="ubub">'+esc(S._sent)+'</div>'); successCard(); } else if(S._pdf) row('u','<div class="ubub">Lo descargo en PDF</div>'); continue; }
    larryPart(b, false);
    if(b.k==='ask') userAns(b.f, b.sub);
  }
  // si quedó en el medio de una parada, Larry vuelve a su pose
  const c = curChapter(); if(c>=0) setSide(SCRIPT[CHAPTERS[c]], true);
  refreshSide(); toBottom();
  if(pos>0 && pos<SCRIPT.length) row('c','<div class="ps" style="text-align:center;color:#fff;text-shadow:1px 1px 0 #0b2c5c;margin:6px 0">— SEGUIMOS DONDE LO DEJASTE —</div>');
  setTimeout(()=>stepFrom(pos), 400);
}
(function(){
  const gate=$('#gate'), inp=$('#gateIn'), err=$('#gateErr');
  let ok=false; try{ ok = localStorage.getItem('mm3_ok')==='1'; }catch(e){}
  function start(){ rebuild(); }
  if(ok){ gate.style.display='none'; start(); }
  function tryIt(){
    if(inp.value.trim()===PASSWORD){ try{localStorage.setItem('mm3_ok','1');}catch(e){} gate.classList.add('hide'); setTimeout(()=>gate.style.display='none',400); start(); }
    else { err.textContent='Contraseña incorrecta. Fijate mayúsculas y números.'; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
  }
  $('#gateBtn').onclick=tryIt;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryIt(); });
})();
</script>
